scale(.985);

.no{

<script>


// ==========================================
// التنقل بين الصفحات
// ==========================================

function showPage(id){

document
.querySelectorAll(
".card"
)
.forEach(function(el){

el.classList.add(
"hidden"
);

});


document
.getElementById(id)
.classList.remove(
"hidden"
);


window.scrollTo({

top:0,

behavior:"smooth"

});

}



// ==========================================
// رابط Apps Script الخاص بفرع المصيف
// ==========================================

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxug9-51CMixsMCq0vCshBmwLkiosVD5x3wCdEa4NWekLBOSxg5HqsKJYEsER8FKc3fKQ/exec";



// ==========================================
// إرسال التقييم
// ==========================================

function sendRating(rating){


const payload =
JSON.stringify({

rating:rating,

timestamp:
new Date()
.toISOString(),

browser:
navigator.userAgent,
  
device:
/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)
? "Mobile"
: "Desktop"

});


try{


// ==========================================
// الطريقة الأفضل للجوال وSafari
// ==========================================

if(
navigator.sendBeacon
){


const blob =
new Blob(

[payload],

{
type:
"text/plain;charset=UTF-8"
}

);


navigator.sendBeacon(

WEB_APP_URL,

blob

);


}


// ==========================================
// احتياط للمتصفحات الأخرى
// ==========================================

else{


fetch(

WEB_APP_URL,

{

method:"POST",

mode:"no-cors",

cache:"no-store",

keepalive:true,

headers:{

"Content-Type":
"text/plain;charset=UTF-8"

},

body:
payload

}

);


}


}

catch(error){

console.error(
"خطأ في إرسال تقييم المصيف:",
error
);

}

}



// ==========================================
// نعم
// ==========================================

document
.querySelector(
".yes"
)
.addEventListener(
"click",
function(){


showPage(
"yesPage"
);


sendRating(
"Yes"
);


}
);



// ==========================================
// لا
// ==========================================

".no"

"click",
function(){

"noPage"

sendRating(
"No"
);


}
);


</script>
